components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ID data pada resource terkait.
      schema:
        type: integer
        minimum: 1
        example: 1

  schemas:
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          example: sukses
        code:
          type: string
          example: '201'
        message:
          type: string
          example: Autentikasi berhasil.
        data:
          type: object
          properties:
            token:
              type: string
              description: Plain text Sanctum token. Salin ke tombol Authorize.
            user:
              type: object
              additionalProperties: true

    AuthMeResponse:
      type: object
      properties:
        status:
          type: string
          example: sukses
        code:
          type: string
          example: '200'
        message:
          type: string
          example: Data pelanggan berhasil diambil.
        data:
          type: object
          properties:
            user:
              type: object
              additionalProperties: true

    AuthError:
      type: object
      properties:
        status:
          type: string
          example: gagal
        code:
          type: string
          example: '401'
        message:
          type: string
          example: Email atau kata sandi tidak valid.

    BasicResponse:
      type: object
      properties:
        status:
          type: string
          example: sukses
        code:
          type: string
          example: '200'
        message:
          type: string
        data:
          nullable: true
          description: Isi data mengikuti resource terkait.
          example: null

    KurirResponse:
      type: object
      properties:
        status:
          type: string
          example: sukses
        code:
          type: string
          example: '200'
        message:
          type: string
          example: Daftar kurir/wilayah antar berhasil diambil
        data:
          type: array
          items:
            type: object
            additionalProperties: true

    KurirDeleteResponse:
      type: object
      properties:
        status:
          type: string
          example: sukses
        code:
          type: string
          example: '200'
        message:
          type: string
          example: Kurir/wilayah antar berhasil dihapus
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            dipakai_pada_pesanan:
              type: boolean
              example: true

    EnvelopeResponse:
      type: object
      description: Bentuk envelope yang digunakan oleh sebagian besar Cart, Product, dan Checkout responses.
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: sukses
        code:
          type: string
          example: '200'
        message:
          type: string
        data:
          nullable: true
          description: Struktur data mengikuti endpoint.
        meta:
          nullable: true
          description: Metadata pagination atau metadata lain jika tersedia.
        errors:
          nullable: true
          description: Detail validasi jika terjadi kesalahan.

    ProductWrite:
      type: object
      required: [nama, harga, stok, tersedia, satuan_jual, mudah_rusak]
      properties:
        nama:
          type: string
          maxLength: 255
          example: Apel Fuji
        harga:
          type: integer
          minimum: 0
          example: 25000
        kategori:
          type: string
          nullable: true
          example: Buah
        category_id:
          type: integer
          nullable: true
          example: 1
        stok:
          type: integer
          minimum: 0
          example: 50
        tersedia:
          type: boolean
          example: true
        deskripsi:
          type: string
          nullable: true
          example: Apel segar.
        satuan_jual:
          type: string
          example: kg
        mudah_rusak:
          type: boolean
          example: false
        gambar:
          type: string
          format: binary
          description: File gambar jpeg, png, jpg, gif, atau webp; maksimum 4096 KB.

    ProductUpdate:
      type: object
      properties:
        nama:
          type: string
          maxLength: 255
        harga:
          type: integer
          minimum: 0
        kategori:
          type: string
          nullable: true
        category_id:
          type: integer
          nullable: true
        stok:
          type: integer
          minimum: 0
        tersedia:
          type: boolean
        deskripsi:
          type: string
          nullable: true
        satuan_jual:
          type: string
        mudah_rusak:
          type: boolean
        gambar:
          type: string
          format: binary
          description: File gambar jpeg, png, jpg, gif, atau webp; maksimum 4096 KB.

  responses:
    Unauthorized:
      description: Token tidak ada, tidak valid, atau sudah tidak berlaku.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Forbidden:
      description: Pengguna tidak memiliki izin untuk mengakses resource ini.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    NotFound:
      description: Data tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeResponse'
    ValidationError:
      description: Validasi request gagal.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
